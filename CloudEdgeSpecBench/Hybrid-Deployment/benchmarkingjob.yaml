benchmarkingjob:
  name: "hybrid_cloud_edge_benchmark"
  workspace: "../workspace_hybrid"  # Separate workspace for clean results

  # Points to the REAL environment config
  testenv: "./testenv/real_wan_net/testenv.yaml"

  test_object:
    type: "algorithms"
    algorithms:
      - name: "distributed_spec_decoding"
        url: "./testalgorithms/distributed_spec_decoding/algorithm.yaml"

  rank:
    sort_by: [ { "normalized_speedup": "descend" } ]
    visualization:
      mode: "selected_only"
      method: "print_table"

    selected_dataitem:
      metrics: [ "normalized_speedup", "throughput_tok_s", "acceptance_rate", "latency", "energy_efficiency" ]
      hyperparameters: [ "draft_k", "cloud_ip" ]

    save_mode: "selected_and_all"
