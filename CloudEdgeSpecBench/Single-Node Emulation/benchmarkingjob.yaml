# Cloud-Edge Speculative Decoding Benchmark
# 云边协同推测解码基准测试

benchmarkingjob:
  # job name; string type;
  name: "cloud_edge_speculative_decoding_benchmark"
  
  # workspace to save outputs; string type;
  workspace: "./workspace"

  # 1. THE SIMULATION ENVIRONMENT (The "Network")
  # Points to the environment config which defines RTT, Bandwidth, Jitter, etc.
  # UPDATED: Now points to 'testenv.yaml' instead of 'environment.yaml'
  testenv: "/home/nishant/LOCAL_DISK_D/ianvs/examples/CloudEdgeSpecBench/testenv/cloud_edge_net/testenv.yaml"

  # 2. THE ALGORITHM TO TEST (The "Boss & Intern" Logic)
  # Points to your speculative decoding logic configuration.
  test_object:
    type: "algorithms"
    algorithms:
      - name: "speculative_decoding_scheduler"
        url: "/home/nishant/LOCAL_DISK_D/ianvs/examples/CloudEdgeSpecBench/testalgorithms/speculative_decoding/algorithm.yaml"

  # 3. RANKING & METRICS (The "Scoreboard")
  rank:
    # Sorting priority (The "Winning Criteria"):
    # 1. Speedup: Is it faster than cloud-only?
    # 2. Reliability (p95): Is it stable?
    # 3. Accuracy (Gamma): Is the intern smart?
    sort_by: 
      - { "normalized_speedup": "descend" }
      - { "p95_latency": "ascend" }
      - { "acceptance_rate": "descend" }

    # visualization configuration
    visualization:
      mode: "selected_only"
      method: "print_table"

    # selected dataitem configuration
    # This controls exactly what columns appear in your final report.
    selected_dataitem:
      paradigms: [ "all" ]
      modules: [ "all" ]
      
      # Crucial: Show the "Cause" (The Variables we changed)
      hyperparameters: 
        - "draft_k"            # Algorithm: Draft Length (1-10)
        - "compute_ratio"      # Hardware: Intern vs Boss speed
        - "dataset_task"       # Data: Code vs Chat
        - "concurrency"        # System: Load 1-50 Users
        
      # Crucial: Show the "Effect" (The Metrics we measured)
      metrics: 
        # -- Value --
        - "normalized_speedup" # Did we beat the baseline?
        - "throughput_tok_s"   # Raw Speed
        
        # -- Accuracy --
        - "acceptance_rate"    # Gamma (How often was the Intern right?)
        
        # -- Responsiveness --
        - "ttft_ms"            # Time To First Token
        
        # -- Reliability --
        - "p50_latency"        # Median Latency
        - "p95_latency"        # Tail Latency (Stability)
        - "stream_jitter"      # Smoothness
        
        # -- Cost --
        - "energy_efficiency"  # Battery usage (J/Tok)

    # Save results to CSV for your report
    save_mode: "selected_and_all"