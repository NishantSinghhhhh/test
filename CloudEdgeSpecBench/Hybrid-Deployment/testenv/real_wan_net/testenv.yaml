testenv:
  dataset:
    train_index: "/home/nishant/LOCAL_DISK_D/ianvs/examples/CloudEdgeSpecBench/Hybrid-Deployment/dataset/test_data.txt"
    test_index: "/home/nishant/LOCAL_DISK_D/ianvs/examples/CloudEdgeSpecBench/Hybrid-Deployment/dataset/test_data.txt"
    format: "txt"

  # We call this a "real" environment
  type: "real_wan_environment"

  scenarios:
    - name: "public_internet"
      parameters: 
        concurrency: 1  # We run 1 request at a time for stability

  metrics:
    # We reuse the same metrics file because the math (Speedup = 1/Latency) is the same
    # We just need to copy it over or link it. For safety, let's copy it.
    - name: "normalized_speedup"
      url: "./testenv/real_wan_net/metrics.py"
    - name: "throughput_tok_s"
      url: "./testenv/real_wan_net/metrics.py"
    - name: "acceptance_rate"
      url: "./testenv/real_wan_net/metrics.py"
    - name: "energy_efficiency"
      url: "./testenv/real_wan_net/metrics.py"
    - name: "latency"
      url: "./testenv/real_wan_net/metrics.py"
    - name: "draft_k"
      url: "./testenv/real_wan_net/metrics.py"
    - name: "cloud_ip"
      url: "./testenv/real_wan_net/metrics.py"
