# Benchmarking Job Configuration: Adaptive NASD
# Tests network-adaptive speculative decoding with dynamic K selection

benchmarkingjob:
  # ================================================================
  # JOB IDENTIFICATION
  # ================================================================
  name: "single_node_adaptive_benchmark"
  
  # Workspace directory for adaptive results
  workspace: "./workspace/adaptive"

  # ================================================================
  # TEST ENVIRONMENT
  # ================================================================
  testenv: "./testenv/cloud_edge_net/testenv.yaml"

  # ================================================================
  # ALGORITHM TO BENCHMARK
  # ================================================================
  test_object:
    type: "algorithms"
    algorithms:
      - name: "adaptive_nasd"
        url: "./testalgorithms/adaptive_spec_decoding/algorithm.yaml"

  # ================================================================
  # RESULT RANKING & VISUALIZATION
  # ================================================================
  rank:
    # Sorting criteria (in priority order)
    sort_by: 
      - { "normalized_speedup": "descend" }  # Is it faster than baseline?
      - { "p95_latency": "ascend" }          # Is it stable?
      - { "acceptance_rate": "descend" }     # Is draft model good?

    # Visualization configuration
    visualization:
      mode: "selected_only"
      method: "print_table"

    # Selected data items for final report
    selected_dataitem:
      paradigms: [ "all" ]
      modules: [ "all" ]
      
      # Hyperparameters (The "Cause")
      hyperparameters: 
        - "draft_k"           # Average K used (adaptive)
        - "k_min"             # Minimum K bound
        - "k_max"             # Maximum K bound
        - "rtt_ms"            # Base RTT
        - "bandwidth_mbps"
        - "jitter_ms"
        - "concurrency"
        
      # Metrics (The "Effect")
      metrics: 
        # Performance
        - "normalized_speedup"
        - "throughput_tok_s"
        
        # Quality
        - "acceptance_rate"
        
        # Responsiveness
        - "ttft_ms"
        
        # Reliability
        - "p50_latency"
        - "p95_latency"
        - "stream_jitter"
        
        # Cost
        - "energy_efficiency"
        
        # Adaptive-specific
        - "avg_rtt_measured"  # Measured RTT (for validation)

    # Save configuration
    save_mode: "selected_and_all"