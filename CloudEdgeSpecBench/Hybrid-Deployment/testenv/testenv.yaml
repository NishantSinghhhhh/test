      url: "./testenv/metrics.py"
    - name: "latency"
      url: "./testenv/metrics.py"
    - name: "ttft_ms"
      url: "./testenv/metrics.py"
    - name: "energy_efficiency"
      url: "./testenv/metrics.py"
    - name: "draft_k"
      url: "./testenv/metrics.py"
    - name: "cloud_url"
      url: "./testenv/metrics.py"
    - name: "avg_rtt_ms"  
      url: "./testenv/metrics.py"