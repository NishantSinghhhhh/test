# Algorithm Configuration: Adaptive Speculative Decoding (NASD)
# Network-Adaptive Speculative Decoding with dynamic K selection

algorithm:
  name: "adaptive_nasd"
  paradigm_type: "singletasklearning"
  
  # Module configuration
  modules:
    - type: "basemodel"
      name: "adaptive_k_scheduler"
      url: "./testalgorithms/adaptive_spec_decoding/adaptive_k_scheduler.py"
      class: "AdaptiveKScheduler"
      
      hyperparameters:
        # ================================================================
        # MODEL CONFIGURATION
        # ================================================================
        - draft_model:
            values: ["gpt2"]  # Fast, small model for edge
        
        - target_model:
            values: ["gpt2-medium"]  # Accurate, larger model for cloud
        
        # ================================================================
        # ADAPTIVE K CONFIGURATION
        # ================================================================
        - k_min:
            values: [1]  # Minimum draft length
        
        - k_max:
            values: [10]  # Maximum draft length
        
        # ================================================================
        # REPRODUCIBILITY
        # ================================================================
        - random_seed:
            values: [42]  # Fixed seed for deterministic results
        
        - do_sample:
            values: [false]  # Greedy decoding (deterministic)

  # Global hyperparameters (from testenv scenarios)
  hyperparameters:
    # ================================================================
    # NETWORK PARAMETERS (Auto-injected from testenv)
    # ================================================================
    rtt_ms:
      values: [10, 40, 100, 200]  # Test across different RTTs
    
    bandwidth_mbps:
      values: [1000, 500, 50, 10]  # Test across different bandwidths
    
    jitter_ms:
      values: [0, 5, 20, 50]  # Test across different jitter levels
    
    concurrency:
      values: [1, 5]  # Test with different loads
    
    # ================================================================
    # OTHER PARAMETERS
    # ================================================================
    compute_ratio:
      values: [1.0]  # Draft/Verify speed ratio
    
    dataset_task:
      values: ["WikiText"]  # Task type