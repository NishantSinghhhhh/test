benchmarkingjob:
  name: "adaptive_benchmark"
  workspace: "./workspace_hybrid/adaptive"

  testenv: "./testenv/testenv.yaml"  # SAME testenv

  test_object:
    type: "algorithms"
    algorithms:
      - name: "adaptive_nasd"
        url: "./testalgorithms/adaptive_spec_decoding/algorithm.yaml"

  rank:
    sort_by: [{ "normalized_speedup": "descend" }]
    visualization:
      mode: "selected_only"
      method: "print_table"
    selected_dataitem:
      paradigms: ["all"]
      modules: ["all"]
      metrics: ["normalized_speedup", "throughput_tok_s", "acceptance_rate", "latency", "ttft_ms", "draft_k", "avg_rtt_ms", "energy_efficiency"]
      hyperparameters: ["cloud_url", "k_min", "k_max"]
    save_mode: "selected_and_all"