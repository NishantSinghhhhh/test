# Algorithm Configuration: Speculative Decoding
# Defines the speculative decoding scheduler and its hyperparameters

algorithm:
  name: "speculative_decoding"
  paradigm_type: "singletasklearning"
  
  # Module configuration
  modules:
    - type: "basemodel"
      name: "cloud_edge_scheduler"
      url: "./testalgorithms/speculative_decoding/spec_scheduler.py"
      class: "SpeculativeScheduler"
      
      hyperparameters:
        # ================================================================
        # MODEL CONFIGURATION
        # ================================================================
        - draft_model:
            values: ["gpt2"]  # Fast, small model for edge
        
        - target_model:
            values: ["gpt2-medium"]  # Accurate, larger model for cloud
        
        # ================================================================
        # REPRODUCIBILITY
        # ================================================================
        - random_seed:
            values: [42]  # Fixed seed for deterministic results
        
        - do_sample:
            values: [false]  # Greedy decoding (deterministic)

  # Global hyperparameters (Grid Search)
  hyperparameters:
    # ================================================================
    # ALGORITHM PARAMETERS
    # ================================================================
    draft_k:
      values: [1, 3, 5]  # Draft lookahead length
      # 1: Minimal speculation (frequent verification)
      # 3: Balanced (recommended)
      # 5: Aggressive speculation (amortizes network cost)
    
    # ================================================================
    # NETWORK PARAMETERS (Auto-injected from testenv scenarios)
    # ================================================================
    rtt_ms:
      values: [10, 40, 100, 200]  # Round-trip time
    
    bandwidth_mbps:
      values: [1000, 500, 50, 10]  # Bandwidth
    
    jitter_ms:
      values: [0, 5, 20, 50]  # Network jitter
    
    concurrency:
      values: [1, 5]  # Concurrent requests
    
    # ================================================================
    # OTHER PARAMETERS
    # ================================================================
    compute_ratio:
      values: [1.0]  # Draft/Verify speed ratio (1.0 = same hardware)
    
    dataset_task:
      values: ["WikiText"]  # Task type