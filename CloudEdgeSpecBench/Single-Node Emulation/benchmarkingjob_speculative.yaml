# Benchmarking Job Configuration: Speculative Decoding (Fixed K)
# Tests edge-cloud collaboration with fixed draft lengths

benchmarkingjob:
  # ================================================================
  # JOB IDENTIFICATION
  # ================================================================
  name: "single_node_speculative_benchmark"
  
  # Workspace directory for speculative results
  workspace: "./workspace/speculative"

  # ================================================================
  # TEST ENVIRONMENT
  # ================================================================
  testenv: "./testenv/cloud_edge_net/testenv.yaml"

  # ================================================================
  # ALGORITHM TO BENCHMARK
  # ================================================================
  test_object:
    type: "algorithms"
    algorithms:
      - name: "speculative_decoding"
        url: "./testalgorithms/speculative_decoding/algorithm.yaml"

  # ================================================================
  # RESULT RANKING & VISUALIZATION
  # ================================================================
  rank:
    # Sorting criteria (in priority order)
    sort_by: 
      - { "normalized_speedup": "descend" }  # Is it faster than baseline?
      - { "p95_latency": "ascend" }          # Is it stable?
      - { "acceptance_rate": "descend" }     # Is draft model good?

    # Visualization configuration
    visualization:
      mode: "selected_only"
      method: "print_table"

    # Selected data items for final report
    selected_dataitem:
      paradigms: [ "all" ]
      modules: [ "all" ]
      
      # Hyperparameters (The "Cause")
      hyperparameters: 
        - "draft_k"
        - "rtt_ms"
        - "bandwidth_mbps"
        - "jitter_ms"
        - "concurrency"
        
      # Metrics (The "Effect")
      metrics: 
        # Performance
        - "normalized_speedup"
        - "throughput_tok_s"
        
        # Quality
        - "acceptance_rate"
        
        # Responsiveness
        - "ttft_ms"
        
        # Reliability
        - "p50_latency"
        - "p95_latency"
        - "stream_jitter"
        
        # Cost
        - "energy_efficiency"

    # Save configuration
    save_mode: "selected_and_all"